<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorisation Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f3ec;--card:#fffdf8;--ink:#1f2a24;--mute:#6b746e;--accent:#1f6b52;--line:#e2ddd0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1a2420;--ink:#e8efe9;--mute:#98a59d;--accent:#4fc39b;--line:#2b3a33}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a2420;--ink:#e8efe9;--mute:#98a59d;--accent:#4fc39b;--line:#2b3a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.hero{text-align:center}
.lbl{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:2rem;color:var(--accent);margin:6px 0;font-weight:600}
.sub{color:var(--mute);font-size:.95rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:1.15rem}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input[type=number],input[type=date]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.days label{display:flex;align-items:center;gap:4px;margin:0;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
</style>
</head>
<body>
<main>
<h1>Memorisation Planner</h1>

<div class="card hero">
  <div class="lbl">Predicted completion</div>
  <div class="big" id="finish">—</div>
  <div class="sub" id="away"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="sub" id="pct"></div>
</div>

<div class="card hero">
  <div class="lbl">Next juz finished</div>
  <div class="big" id="juzDate">—</div>
  <div class="sub" id="juzInfo"></div>
</div>

<div class="card grid">
  <div class="stat"><span class="lbl">Today's reads</span><b id="today">—</b></div>
  <div class="stat"><span class="lbl">Current ½ page</span><b id="cur">—</b></div>
  <div class="stat"><span class="lbl">Weekday pace</span><b id="wd">—</b></div>
  <div class="stat"><span class="lbl">Weekend pace</span><b id="we">—</b></div>
  <div class="stat"><span class="lbl">Current page</span><b id="pg">—</b></div>
  <div class="stat"><span class="lbl">Current surah</span><b id="sur">—</b></div>
</div>

<div class="card">
  <div class="grid">
    <div><label>Total ½ pages to memorise</label><input type="number" id="total" min="1" value="1208"></div>
    <div><label>½ pages fully done</label><input type="number" id="done" min="0" value="0"></div>
    <div><label>Reads done on current ½ page</label><input type="number" id="curReps" min="0" value="0"></div>
    <div><label>Reads needed per ½ page</label><input type="number" id="need" min="1" value="50"></div>
    <div><label>Weekday reads per prayer</label><input type="number" id="wdR" min="0" value="7"></div>
    <div><label>Weekend reads per prayer</label><input type="number" id="weR" min="0" value="10"></div>
    <div><label>Prayers per day</label><input type="number" id="pr" min="1" max="10" value="5"></div>
    <div><label>Count from</label><input type="date" id="from"></div>
  </div>
  <label style="margin-top:14px">Weekend days</label>
  <div class="days" id="days"></div>
  <p class="sub" style="margin-bottom:0">Default 1208 = full Quran at 604 pages. Use 2× pages for a custom range (e.g. 20 pages = 40).</p>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ids = ['total','done','curReps','need','wdR','weR','pr','from'];
let weekend = [0,6];
const SN = ["Al-Fatiha","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];
const SP = [1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,577,578,580,582,583,585,586,587,587,589,590,591,591,592,593,594,595,595,596,596,597,597,598,598,599,599,600,600,601,601,601,602,602,602,603,603,603,604,604,604];
const JUZ = [1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];

function load(){
  try{
    const s = JSON.parse(localStorage.getItem('hifz-plan')||'null');
    if(s){ ids.forEach(i=>{ if(s[i]!==undefined) $(i).value=s[i]; }); if(s.weekend) weekend=s.weekend; }
  }catch(e){}
}
function save(){
  try{
    const s={weekend}; ids.forEach(i=>s[i]=$(i).value);
    localStorage.setItem('hifz-plan',JSON.stringify(s));
  }catch(e){}
}
function buildDays(){
  $('days').innerHTML='';
  names.forEach((n,i)=>{
    const l=document.createElement('label');
    const c=document.createElement('input'); c.type='checkbox'; c.checked=weekend.includes(i);
    c.onchange=()=>{ weekend = c.checked ? [...new Set([...weekend,i])] : weekend.filter(x=>x!==i); calc(); };
    l.append(c,n); $('days').append(l);
  });
}
const num = (id,d=0)=>{ const v=parseFloat($(id).value); return isNaN(v)?d:Math.max(0,v); };
const fmt = d => d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function calc(){
  const total=num('total',1208), done=num('done'), cur=num('curReps'), need=num('need',50)||50;
  const wdR=num('wdR'), weR=num('weR'), pr=num('pr',5);
  const wdDay=wdR*pr, weDay=weR*pr;
  const doneReps = Math.min(total*need, done*need+cur);
  let remaining = total*need - doneReps;
  const start = $('from').value ? new Date($('from').value+'T00:00:00') : new Date();
  start.setHours(0,0,0,0);
  const perDay = d => weekend.includes(d.getDay()) ? weDay : wdDay;

  $('wd').textContent = wdDay+' reads ('+(wdDay/need).toFixed(2)+' ½p/day)';
  $('we').textContent = weDay+' reads ('+(weDay/need).toFixed(2)+' ½p/day)';
  $('today').textContent = perDay(new Date())+' reads';
  const curHalf = Math.min(total, done+1);
  $('cur').textContent = remaining<=0 ? 'All done' : '#'+curHalf+' of '+total+' ('+(cur%need)+'/'+need+')';
  const pct = total*need ? doneReps/(total*need)*100 : 0;
  $('fill').style.width = pct+'%';
  $('pct').textContent = pct.toFixed(1)+'% complete · '+done+' of '+total+' half pages';

  if(remaining<=0){ $('finish').textContent='Completed 🎉'; $('away').textContent=''; save(); return; }
  if(wdDay<=0 && weDay<=0 || (wdDay<=0 && !weekend.length) ){ $('finish').textContent='—'; $('away').textContent='Set some reads per prayer'; return; }

  const endDate = r => { let x=new Date(start), n=0; while(r>0 && n<40000){ r-=perDay(x); if(r>0) x.setDate(x.getDate()+1); n++; } return x; };
  const d = endDate(remaining);
  $('finish').textContent = fmt(d);

  // Next juz (memorising from page 604 backwards, Madani mushaf)
  const page = total/2 - Math.floor(done/2);
  const here = [];
  SN.forEach((n,i)=>{ const e = i===0 ? 1 : (i<113 ? SP[i+1] : 604); if(SP[i]<=page && page<=e) here.push((i+1)+'. '+n); });
  $('pg').textContent = page;
  $('sur').textContent = here.join(' + ') || '—';
  let j = JUZ.length-1; while(j>0 && JUZ[j]>page) j--;
  const leftHalf = (page-JUZ[j])*2 + (2 - done%2);
  const juzReps = Math.max(0, leftHalf*need - cur);
  $('juzDate').textContent = fmt(endDate(juzReps));
  $('juzInfo').textContent = 'Juz '+(j+1)+' · you\'re on page '+page+', '+leftHalf+' half pages to go (down to page '+JUZ[j]+')';
  const diff = Math.round((d-new Date(new Date().setHours(0,0,0,0)))/864e5);
  const yrs=Math.floor(diff/365), mos=Math.floor((diff%365)/30.44);
  $('away').textContent = diff<0 ? 'Date is in the past' :
    diff+' days away'+(diff>60 ? ' (≈ '+(yrs?yrs+' yr ':'')+mos+' mo)' : '');
  save();
}

load();
if(!$('from').value) $('from').value = new Date().toISOString().slice(0,10);
buildDays();
ids.forEach(i=>$(i).addEventListener('input',calc));
calc();
</script>
</body>
</html>
